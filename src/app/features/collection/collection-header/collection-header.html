<section class="pl-col-head" appReveal="fade-up">
  <h1 class="pl-col-head__title">New Arrivals View All</h1>
  <p class="pl-col-head__count">
    {{ store.totalCount() }} of {{ store.allCount() }} products
  </p>

  <div class="pl-col-head__tabs" role="tablist">
    @for (tab of tabs; track tab.value) {
      <button
        class="pl-col-head__tab"
        [class.pl-col-head__tab--active]="store.category() === tab.value"
        role="tab"
        [attr.aria-selected]="store.category() === tab.value"
        (click)="select(tab)"
      >
        {{ tab.label }}
      </button>
    }
  </div>
</section>
