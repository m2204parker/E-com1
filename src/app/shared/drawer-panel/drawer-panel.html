<div
  class="pl-panel-backdrop"
  [class.pl-panel-backdrop--open]="open()"
  (click)="onBackdropClick()"
></div>

<aside
  class="pl-panel"
  [class.pl-panel--open]="open()"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="label()"
  [attr.aria-hidden]="!open()"
>
  <header class="pl-panel__head">
    <span class="pl-panel__title"><ng-content select="[panelTitle]"></ng-content></span>
    <button class="pl-panel__close" (click)="closed.emit()" aria-label="Close">
      <app-icon name="close" [size]="20"></app-icon>
    </button>
  </header>

  <div class="pl-panel__body">
    <ng-content></ng-content>
  </div>

  @if (showFooter()) {
    <footer class="pl-panel__footer">
      <ng-content select="[panelFooter]"></ng-content>
    </footer>
  }
</aside>
